services:
  - type: web
    name: inbound-bot
    runtime: docker
    plan: starter
    region: oregon
    envVars:
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:////data/inbound_bot.db"
      - key: DEBUG
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
    disk:
      name: inbound-bot-data
      mountPath: /data
      sizeGB: 1
