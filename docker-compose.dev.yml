version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./inbound_bot.db
      - DEBUG=true
      - LOG_LEVEL=DEBUG
