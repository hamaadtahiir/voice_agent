<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - InboundBot Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="h-full bg-slate-100 flex items-center justify-center p-4 antialiased">

  <div class="w-full max-w-md">
    {# Logo / brand header #}
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600 text-white font-bold text-2xl mb-4 shadow-lg shadow-blue-600/30">
        IB
      </div>
      <h1 class="text-2xl font-bold text-slate-800">InboundBot Admin</h1>
      <p class="text-slate-500 text-sm mt-1">Sign in to your account</p>
    </div>

    {# Login card #}
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">

      {# Error message area #}
      <div id="login-error" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm flex items-center gap-2">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 9v2m0 4h.01M12 2a10 10 0 100 20 10 10 0 000-20z"/>
        </svg>
        <span id="login-error-text">Invalid credentials</span>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
        {# Email #}
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">Email address</label>
          <input type="email" id="email" name="email" required autocomplete="email"
                 class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm placeholder-slate-400
                        focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 transition"
                 placeholder="admin@company.com">
        </div>

        {# Password #}
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password"
                 class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm placeholder-slate-400
                        focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 transition"
                 placeholder="Enter your password">
        </div>

        {# Submit #}
        <button type="submit" id="login-btn"
                class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg
                       transition focus:outline-none focus:ring-2 focus:ring-blue-500/40 disabled:opacity-60 disabled:cursor-not-allowed
                       flex items-center justify-center gap-2">
          <span id="login-btn-text">Sign in</span>
          <span id="login-spinner" class="spinner hidden"></span>
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">InboundBot &copy; {{ current_year | default('2026') }}. All rights reserved.</p>
  </div>

  <script>
    /* Redirect away if already logged in */
    (function() {
      var match = document.cookie.match(/(^|;\s*)admin_token=([^;]*)/);
      if (match && match[2]) {
        window.location.href = '/admin/dashboard';
      }
    })();

    function handleLogin(e) {
      e.preventDefault();

      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var errorEl = document.getElementById('login-error');
      var errorText = document.getElementById('login-error-text');
      var btn = document.getElementById('login-btn');
      var btnText = document.getElementById('login-btn-text');
      var spinner = document.getElementById('login-spinner');

      /* Hide previous errors */
      errorEl.classList.add('hidden');

      /* Show loading */
      btn.disabled = true;
      btnText.textContent = 'Signing in...';
      spinner.classList.remove('hidden');

      fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      })
      .then(function(res) {
        if (!res.ok) {
          return res.json().then(function(data) {
            throw new Error(data.detail || data.message || 'Invalid email or password');
          }).catch(function(err) {
            if (err.message) throw err;
            throw new Error('Invalid email or password');
          });
        }
        return res.json();
      })
      .then(function(data) {
        /* Store JWT token as cookie */
        var token = data.access_token || data.token;
        if (!token) throw new Error('No token received');
        document.cookie = 'admin_token=' + encodeURIComponent(token) + '; path=/; max-age=86400; SameSite=Lax';
        window.location.href = '/admin/dashboard';
      })
      .catch(function(err) {
        errorText.textContent = err.message;
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btnText.textContent = 'Sign in';
        spinner.classList.add('hidden');
      });
    }
  </script>
</body>
</html>
